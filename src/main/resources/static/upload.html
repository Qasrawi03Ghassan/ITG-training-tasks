<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images uploader</title>
</head>
<body>
    <h1>Upload images using this simple page</h1>
    <div class="uploader-cont">
        <input id="fileupload" name="fileupload" type="file"><br><br>
        <button type="submit" id="upload-btn" onclick="uploadFile()">Upload</button>
    </div>

    <script>
        async function uploadFile(){
            let formdata = new FormData();
            formdata.append("data",fileupload.files[0]);
            
            await fetch('http://localhost:8080/api/photos', {
                method: "POST",
                body: formdata
            }).then(result => result.text())
                .then(text => alert(text));
        }
    </script>
</body>
</html>
